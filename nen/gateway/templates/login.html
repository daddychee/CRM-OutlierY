<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var d=document.documentElement,t=null;try{t=localStorage.getItem("outliery_theme")}catch(e){}if(t!=="light"&&t!=="dark"){t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark"}d.setAttribute("data-theme",t)})()</script>
<title>Sign in — OUTLIERY</title>
<style>
  :root{--nen:#F7F8FA;--the:#FFFFFF;--vien:#E6E6E6;--chu:#16181C;--phu:#6C6C72;--accent:#2C6FC4}
  :root[data-theme="dark"]{--nen:#090C12;--the:#121826;--vien:#232B3D;--chu:#E8EDF4;--phu:#8B96A8;--accent:#4C8FE0}
  *{box-sizing:border-box;margin:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--nen);color:var(--chu);
       min-height:100vh;display:grid;place-items:center}
  .the{background:var(--the);border:1px solid var(--vien);border-radius:14px;
       padding:32px;width:min(360px,92vw)}
  h1{font-size:18px;margin-bottom:4px}
  .phu{color:var(--phu);font-size:13px;margin-bottom:20px}
  label{display:block;font-size:13px;color:var(--phu);margin:12px 0 4px}
  input{width:100%;padding:10px 12px;border:1px solid var(--vien);border-radius:8px;
        background:var(--nen);color:var(--chu);font-size:14px}
  button{width:100%;margin-top:18px;padding:10px;border:0;border-radius:8px;
         background:var(--accent);color:#fff;font-size:14px;font-weight:600;cursor:pointer}
  .loi{color:#B4232A;font-size:13px;margin-top:10px}
  .mo{font-size:13px;color:var(--phu);margin-top:10px;line-height:1.5}
</style>
</head>
<body>
<form class="the" method="post" action="/login">
  <h1>OUTLIERY <span style="color:var(--accent)">v2</span></h1>
  <p class="phu">Bản nền mới — chạy song song hệ chính</p>
  <label for="ten">Username</label>
  <input id="ten" name="ten" autocomplete="username" autofocus>
  <label for="mat_khau">Password</label>
  <input id="mat_khau" name="mat_khau" type="password" autocomplete="current-password">
  <button type="submit">Sign in</button>
  {% if loi %}<p class="loi">{{ loi }}</p>{% endif %}
  {% if che_do_mo %}<p class="mo">Chưa có người dùng nào. Tạo user test:<br>
  <code>python -m nen.gateway.tao_user_test</code></p>{% endif %}
</form>
</body>
</html>
