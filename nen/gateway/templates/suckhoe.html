<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sức khỏe hệ — OUTLIERY v2</title>
<style>
  :root{--nen:#F7F8FA;--the:#FFFFFF;--vien:#E6E6E6;--chu:#16181C;--phu:#6C6C72;--accent:#2C6FC4;
        --ok:#1D7A46;--okbg:#E7F5EC;--loi:#B4232A;--loibg:#FBEAEA}
  @media (prefers-color-scheme: dark){
    :root{--nen:#090C12;--the:#121826;--vien:#232B3D;--chu:#E8EDF4;--phu:#8B96A8;--accent:#4C8FE0;
          --ok:#5CC98B;--okbg:#12291B;--loi:#F08A8F;--loibg:#2E1518}
  }
  *{box-sizing:border-box;margin:0}
  body{font-family:Inter,system-ui,sans-serif;background:var(--nen);color:var(--chu)}
  header{display:flex;justify-content:space-between;padding:14px 24px;
         border-bottom:1px solid var(--vien);background:var(--the)}
  a{color:var(--accent);text-decoration:none}
  main{max-width:720px;margin:32px auto;padding:0 20px}
  table{width:100%;border-collapse:collapse;background:var(--the);
        border:1px solid var(--vien);border-radius:12px;overflow:hidden}
  th,td{padding:12px 16px;text-align:left;font-size:14px;border-bottom:1px solid var(--vien)}
  th{color:var(--phu);font-size:12px;font-weight:600}
  .chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
  .song{background:var(--okbg);color:var(--ok)}
  .chet{background:var(--loibg);color:var(--loi)}
</style>
</head>
<body>
<header><b>Sức khỏe hệ</b><a href="/">← Trang chủ</a></header>
<main>
  <table>
    <tr><th>App</th><th>Cổng</th><th>Phiên bản</th><th>Trạng thái</th></tr>
    {% for r in ket_qua %}
    <tr>
      <td>{{ r.app.ten }}</td>
      <td>{{ r.app.cong }}</td>
      <td>{{ r.app.phien_ban }}</td>
      <td>{% if r.song %}<span class="chip song">● đang chạy</span>
          {% else %}<span class="chip chet">● không phản hồi</span>{% endif %}</td>
    </tr>
    {% endfor %}
  </table>
</main>
</body>
</html>
