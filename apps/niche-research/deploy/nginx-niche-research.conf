# nginx site cho Niche Research — cùng VPS với PlannerY (8123) + Content Ultimate (8770)
# Port: 8780  |  URL: https://niche-research.45.32.107.108.sslip.io
#
# Cài đặt:
#   sudo cp nginx-niche-research.conf /etc/nginx/sites-available/niche-research
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d niche-research.45.32.107.108.sslip.io
#
# Lưu ý nginx sau certbot: file sites-enabled là file thật (không symlink) nên
# phải sửa listen 443 ssl thành listen 45.32.107.108:443 ssl (ghi IP cụ thể).

server {
    listen 80;
    server_name niche-research.45.32.107.108.sslip.io;

    location / {
        auth_basic           "Niche Research";
        auth_basic_user_file /opt/niche-research/.htpasswd;

        proxy_pass http://127.0.0.1:8780;
        proxy_set_header Host $host;
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Pipeline YouTube + LLM chạy lâu — không cắt kết nối
        proxy_read_timeout 3600s;

        # SSE (log stream) — tắt buffer nginx để client nhận ngay từng dòng
        proxy_buffering off;
        proxy_cache     off;

        # Upload competitors.txt (thường nhỏ, để 10MB là thừa)
        client_max_body_size 10m;
    }
}
