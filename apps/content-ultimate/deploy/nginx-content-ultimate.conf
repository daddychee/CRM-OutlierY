# nginx site cho Content Ultimate — copy vào /etc/nginx/sites-available/content-ultimate
# (sửa server_name), symlink sang sites-enabled, rồi chạy certbot để có HTTPS.
#
# Mô hình auth: nginx basic auth (htpasswd) là CỔNG DUY NHẤT vào app — app bind
# 127.0.0.1 nên không ai vào thẳng được. Tên đăng nhập truyền xuống app qua header
# X-Remote-User để app nhận diện quản trị viên (ADMIN_USERS trong .env).
#
# File mật khẩu đặt TRONG folder app (/opt/content-ultimate/.htpasswd) để tính năng
# "khóa mời" tự thêm được tài khoản (htpasswd cần quyền ghi cả file lẫn thư mục):
#   chown contentult:www-data /opt/content-ultimate/.htpasswd && chmod 640 ...
#
# Nếu máy đã có dịch vụ giữ cổng 443 (vd Tailscale serve): đổi `listen 443 ssl;`
# certbot sinh ra thành `listen <IP-công-khai>:443 ssl;` (xem SETUP-VPS.md).

server {
    listen 80;
    server_name content.example.com;    # <-- đổi thành domain của bạn

    # Trang nhận lời mời — PUBLIC (người mới chưa có tài khoản): app tự kiểm khóa mời
    # + tự chặn brute-force theo IP. CLEAR X-Remote-User để client không mạo danh admin
    # qua location này (mặc định nginx forward header client không có underscore).
    location /invite {
        auth_basic off;
        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        proxy_set_header X-Remote-User "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        auth_basic           "Content Ultimate";
        auth_basic_user_file /opt/content-ultimate/.htpasswd;

        proxy_pass http://127.0.0.1:8770;
        proxy_set_header Host $host;
        # user đã xác thực -> app nhận diện quản trị viên; GHI ĐÈ giá trị client gửi (chống
        # mạo danh: kẻ gửi 'X-Remote-User: thanh' bị thay bằng $remote_user thật của htpasswd)
        proxy_set_header X-Remote-User $remote_user;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # job dài (pipeline video / LLM viết chương) — không cắt kết nối poll
        proxy_read_timeout 3600s;
        # upload bản thảo (JSON) — sách vài MB/file
        client_max_body_size 100m;
    }
}
