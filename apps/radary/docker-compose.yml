# Chạy trọn bộ Radary: docker compose up -d
# Dữ liệu (DB + secret.key + thumbnail + report) nằm ở ./data trên máy host — backup folder này là đủ.
services:
  radary:
    build: .
    ports:
      - "127.0.0.1:8000:8000"   # CHỈ localhost — trên VPS truy cập qua Tailscale (tailscale serve),
                                # KHÔNG BAO GIỜ mở thẳng 8000 ra internet công cộng khi chưa có HTTPS+rate-limit
    volumes:
      - ./data:/app/data
    environment:
      # RADARY_SECRET: đặt khi deploy VPS để khóa chủ không nằm trong volume (xem radary/crypto.py)
      RADARY_SECURE_COOKIE: "1"     # truy cập luôn qua HTTPS (tailscale serve/funnel) — bật từ 08/07/2026
      RADARY_INVITE_ONLY: "1"       # lộ internet qua Funnel: đăng ký MỚI phải kèm mã mời (deploy_vps.md §8)
      RADAR_BUDGET: "120"
    restart: unless-stopped
