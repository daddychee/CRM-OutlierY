<style>

* { box-sizing:border-box; margin:0 }
body { background:var(--bg); color:var(--text); font:14px/1.5 'Inter',-apple-system,'Segoe UI',Roboto,sans-serif }

select.ws { margin-left:auto; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:14px }

.spin { display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:sp 1s linear infinite; vertical-align:-2px }
@keyframes sp { to { transform:rotate(360deg) } }
/* ---- viz (palette đã chạy validator dataviz trên nền panel sáng/tối) ---- */
:root { --viz-series:#2a78d6; --viz-band:rgba(137,135,129,.14); --viz-ref:#898781;
        --viz-grid:#e9e8e2; --viz-mk-title:#eda100; --viz-mk-thumb:#4a3aa7;
        --viz-up:#006300; --viz-down:#d03b3b;
        --viz-p90:#c81e1e; --viz-p75:#e88585; }
:root[data-theme="dark"] { --viz-series:#3987e5; --viz-grid:#26334b; --viz-mk-title:#c98500; --viz-mk-thumb:#9085e9;
          --viz-up:#0ca30c; --viz-down:#e66767;
          --viz-p90:#ef4444; --viz-p75:#f28a8a; }
.modalback { position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-start; justify-content:center; padding:36px 14px; z-index:50; overflow-y:auto }
.modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:100%; max-width:780px; position:relative }

.mklegend { display:flex; gap:14px; font-size:12px; color:var(--muted); margin-top:4px; flex-wrap:wrap }
.mklegend .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:5px; vertical-align:-1px }
tr.clickable { cursor:pointer }

.cyclerow { display:flex; gap:10px; align-items:baseline; padding:5px 2px; border-bottom:1px solid var(--line); font-size:12.5px; flex-wrap:wrap }

          background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:10px 12px }

.rolechip.viewer { background:var(--bg); color:var(--muted); border:1px solid var(--line) }

.starbtn.on { color:#f5b301 }
.starbtn:disabled { cursor:default; opacity:.7 }
.favstar { color:#f5b301 }
.askrow { border-top:1px solid var(--line); margin-top:12px; padding-top:10px }
.askq { font-weight:600; font-size:13.5px }
.aska { margin-top:6px; font-size:13.5px }
.aska p { margin:6px 0 }
.aska table { margin:6px 0 }
/* ---- Metrics (sắp xếp kiểu vidIQ: nhãn trên, số dưới, pill cùng dòng số) ---- */
.mtr1 { display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:10px; margin:10px 0 }
.mtr2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:4px }
.tile { background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:10px 14px }
.tile > span { display:block; color:var(--muted); font-size:12px; margin-bottom:3px; white-space:nowrap }

          font-variant-numeric:tabular-nums }

.pill { font-size:11px; font-weight:700; border-radius:99px; padding:1.5px 8px; white-space:nowrap }
.pill.up { color:var(--viz-up); background:color-mix(in srgb, var(--viz-up) 13%, transparent) }
.pill.dn { color:var(--viz-down); background:color-mix(in srgb, var(--viz-down) 13%, transparent) }
.pill.gy { color:var(--muted); background:color-mix(in srgb, var(--muted) 13%, transparent); font-weight:600 }
/* ---- Heatmap giờ đăng ---- */
.hmwrap { position:relative }
.hmrow { display:grid; grid-template-columns:32px repeat(24, 1fr); gap:3px; align-items:center; margin-top:3px }
.hmhead span { font-size:10px; color:var(--muted); text-align:center }
.hmlab { font-size:11px; color:var(--muted); text-align:right; padding-right:5px }
.hmcell { aspect-ratio:1; border-radius:4px; background:var(--viz-grid);
          background:color-mix(in srgb, var(--viz-series) calc(var(--a, 0)*100%), var(--viz-grid) 16%); cursor:pointer }
.hmcell:hover { outline:1.5px solid var(--text); outline-offset:1px }
.hmtip { position:absolute; transform:translate(-50%,-104%); background:var(--panel); border:1px solid var(--line);
         border-radius:10px; padding:8px 12px; font-size:12.5px; box-shadow:0 6px 20px rgba(0,0,0,.25);

.hmtr { display:flex; justify-content:space-between; gap:16px; color:var(--muted) }
.hmpop { border:1px solid var(--accent); border-radius:10px; padding:9px 13px; margin-top:8px; font-size:13px; max-width:560px }

.hsteps { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin-top:6px }

.hstep.done { background:color-mix(in srgb, var(--viz-up) 14%, transparent); color:var(--viz-up); border-color:var(--viz-up); font-weight:600 }
.hstep.now { background:var(--accent-soft); color:var(--accent); border-color:var(--accent); font-weight:700 }

.htree { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:10px; margin-top:10px }
.hleaf { border:1px solid var(--line); border-radius:10px; padding:11px 13px; font-size:13px }
.hleaf.sel { border-color:var(--accent); background:var(--accent-soft) }
.hleaf h3 { margin:0; font-size:13.5px } .hleaf h3 input { vertical-align:-2px; margin-right:6px }
.hwarn { color:#e5a50a; font-size:12px; font-weight:400 }
.hchl { margin-top:8px; border-top:1px dashed var(--line); padding-top:6px; font-size:12.5px; max-height:180px; overflow-y:auto }

.hx { color:var(--viz-down); cursor:pointer; font-weight:700; padding:0 4px }

.htier.A { background:var(--viz-up); color:#fff } .htier.B { background:var(--line); color:var(--muted) }
